name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          envs: GH_PAT,GH_REPO,ANTHROPIC_API_KEY,ANTHROPIC_MODEL,NEXT_PUBLIC_APP_URL,SESSION_COOKIE_NAME
          script: |
            # Ensure Docker daemon is running
            if ! docker info > /dev/null 2>&1; then
              echo "Docker is not running. Starting Docker..."
              sudo systemctl start docker
              sleep 3
            fi

            REPO_NAME="${GH_REPO##*/}"
            REPO_DIR="$HOME/$REPO_NAME"
            mkdir -p "$REPO_DIR"
            REMOTE_URL="https://${GH_PAT}@github.com/${GH_REPO}.git"
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" remote set-url origin "$REMOTE_URL"
            elif [ -d "$REPO_DIR" ]; then
              git -C "$REPO_DIR" init
              git -C "$REPO_DIR" remote add origin "$REMOTE_URL" 2>/dev/null || \
                git -C "$REPO_DIR" remote set-url origin "$REMOTE_URL"
            else
              git clone "$REMOTE_URL" "$REPO_DIR"
            fi
            git -C "$REPO_DIR" fetch origin
            git -C "$REPO_DIR" checkout main
            git -C "$REPO_DIR" reset --hard origin/main
            cd "$REPO_DIR/app"
            umask 077
            cat > .env <<EOF
            DATABASE_URL=postgresql://postgres:postgres@db:5432/appdb
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
            NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
            SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-ag_author}
            NODE_ENV=production
            EOF
            docker compose up -d --build --wait || {
              echo "=== Deployment failed. Container logs: ==="
              docker compose logs --tail=50
              exit 1
            }
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SESSION_COOKIE_NAME: ${{ vars.SESSION_COOKIE_NAME }}
